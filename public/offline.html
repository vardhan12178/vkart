<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>You're offline | VKart</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: #f7f3ec; color: #1d1c19; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 22rem; }
    .mark { width: 64px; height: 64px; border-radius: 50%; background: #1d1c19; margin: 0 auto 20px; display: grid; place-items: center; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { margin: 0 0 20px; color: #6f6b62; line-height: 1.5; }
    button { border: 0; border-radius: 999px; background: #1d1c19; color: #fffdf8; font: inherit; font-weight: 700; padding: 12px 28px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fffdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>VKart needs a connection to show products and prices. Your bag is saved on this device and will be here when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
